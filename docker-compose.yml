services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairpass
      POSTGRES_USER: fairpass
      POSTGRES_PASSWORD: fairpass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./migrations/000002_booking_reservations.up.sql:/docker-entrypoint-initdb.d/002-booking-reservations.sql:ro
      - ./migrations/000003_abuse_controls.up.sql:/docker-entrypoint-initdb.d/003-abuse-controls.sql:ro
      - ./migrations/000004_payment_attempts.up.sql:/docker-entrypoint-initdb.d/004-payment-attempts.sql:ro
      - ./migrations/000005_quai_wallets.up.sql:/docker-entrypoint-initdb.d/005-quai-wallets.sql:ro
      - ./migrations/000006_ticket_signatures.up.sql:/docker-entrypoint-initdb.d/006-ticket-signatures.sql:ro
      - ./migrations/000007_resale_checkout.up.sql:/docker-entrypoint-initdb.d/007-resale-checkout.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairpass -d fairpass"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://fairpass:fairpass@db:5432/fairpass?sslmode=disable
      TICKET_SIGNING_PRIVATE_KEY: ${TICKET_SIGNING_PRIVATE_KEY:-}
      QUAI_BRIDGE_URL: http://quai-bridge:8090
      QUAI_BRIDGE_TOKEN: ${QUAI_BRIDGE_TOKEN:-}
      QUAI_CONTRACT_ADDRESS: ${QUAI_CONTRACT_ADDRESS:-}
      QUAI_PRIVATE_KEY: ""
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  quai-bridge:
    build: ./quai-bridge
    env_file: .env
    environment:
      QUAI_RPC_URL: ${QUAI_RPC_URL:-https://orchard.rpc.quai.network}
      QUAI_PRIVATE_KEY: ${QUAI_PRIVATE_KEY:-}
      QUAI_CONTRACT_ADDRESS: ${QUAI_CONTRACT_ADDRESS:-}
      QUAI_BRIDGE_TOKEN: ${QUAI_BRIDGE_TOKEN:-}
      QUAI_CONFIRMATIONS: ${QUAI_CONFIRMATIONS:-1}
    expose: ["8090"]
volumes:
  pgdata:
