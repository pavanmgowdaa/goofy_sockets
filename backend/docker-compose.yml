services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairpass
      POSTGRES_USER: fairpass
      POSTGRES_PASSWORD: fairpass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairpass -d fairpass"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://fairpass:fairpass@db:5432/fairpass?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
