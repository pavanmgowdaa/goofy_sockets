<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAIRPASS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div><strong>FAIRPASS</strong><span class="muted"> / Organizer Console</span></div>
        <button id="logout" class="secondary" hidden>Logout</button>
      </header>

      <section id="login-panel" class="card">
        <h1>Organizer login</h1>
        <p>Sign in with WhatsApp. No Apple or password login.</p>
        <label>WhatsApp number
          <input id="phone" inputmode="tel" placeholder="+15551234567" />
        </label>
        <button id="request-otp">Send OTP</button>
        <div id="otp-step" hidden>
          <label>One-time code
            <input id="otp" inputmode="numeric" maxlength="6" />
          </label>
          <button id="verify-otp">Verify & login</button>
        </div>
        <p id="auth-message" class="message"></p>
      </section>

      <section id="console-panel" hidden>
        <div class="grid">
          <article class="card">
            <h2>Scan / Verify / Redeem</h2>
            <label>Ticket reference
              <input id="reference" value="FAIR-001" />
            </label>
            <label>Sensor pattern
              <select id="sensor">
                <option value="clear">Clear passage</option>
                <option value="tailgating">Tailgating</option>
                <option value="unusual">Unusual movement</option>
              </select>
            </label>
            <div class="actions">
              <button id="verify-ticket" class="secondary">Verify</button>
              <button id="redeem-ticket">Redeem / Gate</button>
            </div>
            <pre id="ticket-result" class="result">Ready</pre>
          </article>

          <article class="card">
            <h2>Dashboard</h2>
            <div class="metrics">
              <div><b id="accepted">0</b><span>Accepted</span></div>
              <div><b id="rejected">0</b><span>Rejected</span></div>
              <div><b id="duplicate">0</b><span>Duplicates</span></div>
              <div><b id="sensors">0</b><span>Sensor alerts</span></div>
            </div>
            <div class="notice" id="network-state">Blockchain: demo mode</div>
            <div id="events" class="events"></div>
          </article>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
